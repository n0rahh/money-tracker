name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
        env:
          TZ: Europe/Warsaw
      # The node:sqlite tests of scripts/ (Vitest runs src/ only); the glob, since `node --test scripts/` reads a folder as a file.
      - run: npm run test:scripts
      # The Firestore emulator behind test:rules needs Java 21+.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm run test:rules
